name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Ruff
        run: uv run --only-group dev ruff check . --output-format github

  test:
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Pytest
        run: uv run pytest -v

  app:
    name: Build app (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Cache the Parakeet model
        uses: actions/cache@v6
        with:
          path: models
          key: model-${{ hashFiles('scripts/download_model.py') }}
      - name: Download the model (skipped when cached)
        run: uv run --locked python scripts/download_model.py parakeet
      - name: Build sst.exe and check that it transcribes
        run: uv run --locked --group build python scripts/build_installer.py --no-installer
