[project]
name = "sst"
version = "0.1.0"
description = "Record from the microphone and transcribe it locally (Parakeet first, more engines later)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "sherpa-onnx==1.13.8",
    # Ships the matching onnxruntime.dll. It is not pulled in automatically, and without it
    # Windows loads its own older System32\onnxruntime.dll and model loading fails.
    "sherpa-onnx-core==1.13.8",
    "sounddevice>=0.5",
]

[project.scripts]
sst = "sst.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sst"]
